# Build the web version and publish it to GitHub Pages.
#
# **Disabled as an automatic trigger, on purpose.** Pages is currently served
# from the `gh-pages` branch ("Deploy from a branch"), and in that mode GitHub
# refuses Actions deployments to the `github-pages` environment - this workflow's
# `deploy` job failed in one second with no runner assigned. Worse, it shares
# the `pages` concurrency group with GitHub's own built-in Pages workflow, so
# leaving it on a push trigger meant the two competed and *neither* deployed.
#
# Publishing therefore goes through `npm run publish:pages`, which pushes the
# build to `gh-pages` and lets GitHub's built-in publisher take it from there.
# See docs/12-AUF-DEM-HANDY-TESTEN.md.
#
# To switch back to deploying from Actions: set Settings -> Pages -> Source to
# "GitHub Actions", then restore the `push:` trigger below. Both halves are
# needed; either one alone produces the failure described above.
#
# This is how the game gets onto a phone without a Mac, without Xcode and
# without a store account: the browser build is the same code the native shell
# would wrap (ADR-015), and as an installable PWA it lands on the home screen
# with its own icon and its own window.
#
# The full gate runs first. Publishing a build that does not pass `verify` would
# make the thing on the phone useless as a test - you would not know whether a
# bug is in the game or in the build.
name: Deploy Pages

on:
  # Manual only. The `push:` trigger is commented out rather than deleted so
  # switching back is one edit, not archaeology.
  #
  # push:
  #   branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. `cancel-in-progress: false` because cancelling a
# half-finished deploy is how a site ends up in a broken state.
concurrency:
  # Named apart from GitHub's built-in Pages workflow, which uses "pages".
  # Sharing that group is what let the two block each other.
  group: pages-actions
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Qualitäts-Gate
        run: npm run verify

      - name: Bauen
        run: npm run build

      # `enablement: true` switches Pages on for the repository the first time
      # this runs, so there is nothing to click in the settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
