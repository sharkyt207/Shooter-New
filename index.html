<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#080A0F" />
    <!-- Relative, so the same build works at a domain root, in a GitHub Pages
         subpath and inside a Capacitor web view. -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="description" content="PROJECT ECHO - Isometrischer Extraction-Shooter in einer zerbrochenen Realität." />

    <!-- Fullscreen, no browser chrome, when added to the iOS home screen. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Installable: home-screen icon, own window, landscape. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- iOS ignores the manifest's icons and reads this one instead. -->
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />

    <title>PROJECT ECHO</title>
    <script type="module" crossorigin src="./assets/index-D3lQeKET.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/pixi-C2igxpEo.js">
    <link rel="stylesheet" crossorigin href="./assets/index-CyPckw_o.css">
  </head>
  <body>
    <!-- The world is rendered into this canvas by PixiJS. -->
    <div id="game-canvas" class="game-canvas"></div>

    <!-- All UI lives in a DOM overlay above the canvas (ADR-007). -->
    <div id="ui-root" class="ui-root"></div>

  </body>
</html>
